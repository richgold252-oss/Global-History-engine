[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-history-engine"
version = "0.1.0"
description = "Autonomous AI pipeline for researching, scripting, and generating short-form history videos"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rich Gold", email = "richgold252@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "black>=23.0",
]

[project.scripts]
global-history-engine = "src.main:main"

[tool.setuptools.packages.find]
where = [".", "src"]
