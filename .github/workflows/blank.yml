# This is a basic workflow to help you get started with Actions

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint and coverage tools
        run: python -m pip install --upgrade ruff coverage

      - name: Lint Python modules
        run: ruff check src tests

      - name: Run tests with coverage
        run: |
          coverage run --branch -m unittest discover -s tests -v
          coverage report --fail-under=80
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: importer-coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Compile Python modules
        run: python -m py_compile src/*.py
